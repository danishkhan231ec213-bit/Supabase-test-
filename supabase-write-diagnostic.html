<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supabase Write Diagnostic</title>
<style>body{font-family:system-ui;background:#0b0b0d;color:#eee;padding:24px}button{padding:14px 18px;border:0;border-radius:10px;font-size:16px}pre{margin-top:18px;padding:16px;border:1px solid #444;border-radius:10px;white-space:pre-wrap;word-break:break-word}</style>
</head><body>
<h2>Supabase — Write Diagnostic</h2>
<p>This performs one harmless temporary write to <code>app_settings</code>, reads it back, then deletes it.</p>
<button id="run">Test Write</button><pre id="out">Waiting…</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const url="https://jykrvwacqqjtmjvvxpfz.supabase.co";
const key="sb_publishable_Uj0hh26F2LU9A-2tPOOEmg_C5SvdXbm";
const sb=window.supabase.createClient(url,key);
const out=document.getElementById("out");
const keyName="__supabase_write_test__";
async function run(){
  try{
    out.textContent="1. Checking session…";
    let r=await sb.auth.getSession(); if(r.error) throw r.error;
    if(!r.data.session){r=await sb.auth.signInAnonymously(); if(r.error) throw r.error;}
    out.textContent+="\n2. Session OK.";
    out.textContent+="\n3. Upserting test row…";
    r=await sb.from("app_settings").upsert({setting_key:keyName,setting_value:{ok:true,at:new Date().toISOString()}},{onConflict:"setting_key"});
    if(r.error) throw r.error;
    out.textContent+="\n4. WRITE SUCCEEDED.";
    out.textContent+="\n5. Reading it back…";
    r=await sb.from("app_settings").select("*").eq("setting_key",keyName).maybeSingle();
    if(r.error) throw r.error;
    out.textContent+="\n6. READ-BACK SUCCEEDED: "+JSON.stringify(r.data);
    out.textContent+="\n7. Deleting test row…";
    r=await sb.from("app_settings").delete().eq("setting_key",keyName);
    if(r.error) throw r.error;
    out.textContent+="\n8. DELETE SUCCEEDED.\n\n✅ WRITE/READ/DELETE ALL WORK.";
  }catch(e){
    out.textContent+="\n\n❌ FAILED\nmessage: "+(e.message||e)+"\ncode: "+(e.code||"")+"\ndetails: "+(e.details||"")+"\nhint: "+(e.hint||"")+"\nstatus: "+(e.status||"");
  }
}
document.getElementById("run").onclick=run;
</script></body></html>
